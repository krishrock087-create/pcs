
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POSHcs | Company Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f3f6fb;
  color:#172b4d;
  padding:20px;
}
.login-card{
  width:100%;max-width:420px;
  background:white;padding:38px;
  border-radius:16px;
  box-shadow:0 12px 40px rgba(20,45,80,.09);
}
.logo{text-align:center;margin-bottom:30px}
.logo h1{font-size:32px;color:#163b70}
.logo p{font-size:13px;color:#718096;margin-top:7px}
h2{text-align:center;font-size:22px;margin-bottom:8px}
.subtitle{text-align:center;color:#718096;font-size:13px;margin-bottom:28px}
label{display:block;font-size:13px;font-weight:600;margin:17px 0 8px}
input{
  width:100%;padding:14px;
  border:1px solid #dce3ed;border-radius:8px;
  font-size:14px;outline:none;
}
input:focus{border-color:#2563a6}
button{
  width:100%;padding:14px;margin-top:25px;
  border:0;border-radius:8px;
  background:#163b70;color:white;
  font-size:15px;font-weight:600;cursor:pointer;
}
button:hover{background:#24538d}
.help{text-align:center;margin-top:22px;font-size:12px;color:#718096}
.help a{color:#24538d;text-decoration:none}
.footer{text-align:center;margin-top:30px;font-size:11px;color:#9aa6b5}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <h1>POSHcs</h1>
    <p>Powered by AGKENTECH</p>
  </div>

  <h2>Welcome Back</h2>
  <p class="subtitle">Sign in to your company account</p>

  <form id="loginForm">
    <label for="email">Registered Company Email</label>
    <input id="email" type="email" placeholder="Enter registered email" required>

    <label for="accessKey">Unique POSHcs Access Key</label>
    <input id="accessKey" type="password" placeholder="Enter your access key" required>

    <button type="submit">Login to Dashboard</button>
  </form>

  <div class="help">
    Need login assistance?<br><br>
    <a href="https://wa.me/916305992905">Contact AGKENTECH Support</a>
  </div>

  <div class="footer">
    © 2026 AGKENTECH. All rights reserved.
  </div>
</div>
</body>
</html>
